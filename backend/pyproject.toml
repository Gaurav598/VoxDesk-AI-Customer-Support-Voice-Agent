[project]
name = "voxdesk-backend"
version = "0.1.0"
description = "Local-first business voice-agent backend prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
