services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: voxdesk-backend:prod
    container_name: voxdesk_backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8088
      - DATABASE_PATH=/app/data/voice_agent.db
    volumes:
      - voxdesk_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: voxdesk-frontend:prod
    container_name: voxdesk_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: voxdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voxdesk
      POSTGRES_USER: voxdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_agent_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voxdesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  voxdesk_data:
  postgres_data:
